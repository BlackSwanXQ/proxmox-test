name: Deploy Web App to K3s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t harbor.black2swan.ru/myapp/web-page:${{ github.sha }} .
          docker tag harbor.black2swan.ru/myapp/web-page:${{ github.sha }} harbor.black2swan.ru/myapp/web-page:latest
      
      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login https://harbor.black2swan.ru -u admin --password-stdin
      
      - name: Push to Harbor
        run: |
          docker push harbor.black2swan.ru/myapp/web-page:${{ github.sha }}
          docker push harbor.black2swan.ru/myapp/web-page:latest
      
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/web-page --timeout=60s
      
      - name: Verify deployment
        run: |
          kubectl get pods
          echo "✅ Application deployed at http://web.local"
