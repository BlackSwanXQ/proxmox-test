apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-page-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: web.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-page-service
            port:
              number: 80
