<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой K3s кластер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; }
        .pod-name {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: monospace;
            color: #764ba2;
        }
        .status { color: #4caf50; margin: 20px 0; }
        .footer { margin-top: 20px; color: #999; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Hello from K3s!</h1>
        <div class="pod-name">
            Pod: <span id="pod-name">loading...</span>
        </div>
        <div class="status">✅ Кластер работает</div>
        <div class="footer">GitOps • K3s • Harbor</div>
    </div>
    <script>
        fetch('/hostname')
            .then(res => res.text())
            .then(data => {
                document.getElementById('pod-name').textContent = data;
            });
    </script>
</body>
</html>
